[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-arpav-meteo"
version = "1.0.0"
description = "Comprehensive Home Assistant integration for ARPA Veneto Meteo, Hydrology, Snow/Avalanches, Air Quality, Pollen, and Radar."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "ICN",
    "PIE",
    "PGH",
    "PLC",
    "PLE",
    "PLW",
    "RUF",
    "SIM",
    "T20",
    "UP",
    "W",
]
ignore = [
    "D203",
    "D213",
    "E501",
    "PLW2901",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
